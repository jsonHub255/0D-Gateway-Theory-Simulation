<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origin-Point 4D Transit Visualizer | DOI: 10.5281/zenodo.22140243</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 15, 30, 0.85);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            max-width: 360px;
            backdrop-filter: blur(5px);
        }
        h1 {
            font-size: 1.1rem;
            margin-top: 0;
            color: #00d4ff;
        }
        p {
            font-size: 0.85rem;
            line-height: 1.4;
            color: #cccccc;
        }
        .doi-badge {
            display: inline-block;
            background: #102040;
            color: #00ffcc;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }
        #controls {
            margin-top: 15px;
        }
        button {
            background: #00d4ff;
            color: #050508;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #00ffcc;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info-panel">
        <h1>Origin-Point 4D Transit Visualizer</h1>
        <div class="doi-badge">DOI: 10.5281/zenodo.22140243</div>
        <p><strong>Author:</strong> Mohammed Serraj</p>
        <p>This 3D model illustrates the theoretical intersection of higher-dimensional transit strictly at the origin point <code>(0,0,0)</code> of a symmetrical geometric boundary.</p>
        <div id="controls">
            <button onclick="toggleParticle()">Toggle Particle Transit</button>
        </div>
    </div>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 4, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x00d4ff, 1.5, 50);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // Outer Symmetrical Cube (Wireframe)
        const cubeGeo = new THREE.BoxGeometry(4, 4, 4);
        const cubeMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff, wireframe: true, transparent: true, opacity: 0.3 });
        const cubeMesh = new THREE.Mesh(cubeGeo, cubeMat);
        scene.add(cubeMesh);

        // Bounding Sphere (Transparent Glass Effect)
        const sphereGeo = new THREE.SphereGeometry(2.83, 32, 32);
        const sphereMat = new THREE.MeshPhongMaterial({ color: 0x103060, transparent: true, opacity: 0.15, wireframe: true });
        const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(sphereMesh);

        // Coordinate Axes intersecting at (0,0,0)
        const axesHelper = new THREE.AxesHelper(3);
        scene.add(axesHelper);

        // Origin Point Gateway Node (0,0,0)
        const nodeGeo = new THREE.SphereGeometry(0.15, 32, 32);
        const nodeMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
        const originNode = new THREE.Mesh(nodeGeo, nodeMat);
        scene.add(originNode);

        // Pulsing Origin Energy Field
        const pulseGeo = new THREE.SphereGeometry(0.3, 32, 32);
        const pulseMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.4 });
        const pulseMesh = new THREE.Mesh(pulseGeo, pulseMat);
        scene.add(pulseMesh);

        // Particle Transit Simulation
        const particleGeo = new THREE.SphereGeometry(0.08, 16, 16);
        const particleMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
        const particle = new THREE.Mesh(particleGeo, particleMat);
        scene.add(particle);

        let particleActive = true;
        let t = 0;

        function toggleParticle() {
            particleActive = !particleActive;
            if(!particleActive) particle.position.set(-3, 0, 0);
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            // Rotate outer geometry slowly
            cubeMesh.rotation.y += 0.002;
            sphereMesh.rotation.y += 0.002;

            // Pulse the Origin Gateway Node
            const scale = 1 + 0.3 * Math.sin(Date.now() * 0.005);
            pulseMesh.scale.set(scale, scale, scale);

            // Animate Particle moving through (0,0,0)
            if (particleActive) {
                t += 0.02;
                if (t > Math.PI * 2) t = 0;
                particle.position.x = 3 * Math.cos(t);
                
                // Color change when near origin (0,0,0)
                const distToOrigin = particle.position.distanceTo(new THREE.Vector3(0,0,0));
                if (distToOrigin < 0.4) {
                    particle.material.color.setHex(0x00ffcc);
                } else {
                    particle.material.color.setHex(0xff0055);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Handle Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
